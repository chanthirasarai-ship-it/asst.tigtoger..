services:
  - type: web
    name: asst-tigtoger
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: OMISE_PUBLIC_KEY
        sync: false
